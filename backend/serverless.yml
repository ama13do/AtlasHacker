service: atlashacker-api

frameworkVersion: '3'

# IMPORTANTE: los secretos NO se inyectan desde el .env al desplegar. Viven en AWS SSM Parameter Store
# (SecureString) y la Lambda los lee en runtime:   npm run secretos:subir -- --stage dev
useDotenv: false

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512 # argon2id (contraseñas) usa ~20 MB de memoria
  timeout: 15
  logRetentionInDays: 30
  environment:
    NODE_ENV: production # cookies Secure/SameSite=None y captcha obligatorio, también en el stage "dev" desplegado
    SSM_PREFIX: /atlashacker/${self:provider.stage}
    DB_POOL_MAX: '1'
    NODE_OPTIONS: --enable-source-maps
  iam:
    role:
      statements:
        # Solo lectura de SUS parámetros (mínimo privilegio)
        - Effect: Allow
          Action:
            - ssm:GetParametersByPath
            - ssm:GetParameters
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/atlashacker/${self:provider.stage}
            - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/atlashacker/${self:provider.stage}/*
        - Effect: Allow
          Action: kms:Decrypt
          Resource: '*'
          Condition:
            StringEquals:
              kms:ViaService: ssm.${aws:region}.amazonaws.com
  # CORS lo maneja la propia API (lista blanca en CORS_ORIGINS); no se declara aquí para que no lo pise.

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    platform: node
    format: cjs
    concurrency: 10

functions:
  api:
    handler: src/index.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

  # Limpieza diaria: auditoría vencida (según la retención configurada), sesiones y límites expirados
  mantenimiento:
    handler: src/index.mantenimiento
    timeout: 60
    events:
      - schedule: rate(1 day)
